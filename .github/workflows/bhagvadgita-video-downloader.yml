name: BhagvadGita Video Downloader

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Download and validate only; do not touch Release assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bhagvadgita-video-downloader
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      YOUTUBE_CHANNEL_ID: UC2sBCYCH6Kb9dgqQN3vVgFw
      RELEASE_TAG: Friday
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Prepare private YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "::error::Missing YOUTUBE_COOKIES_B64 repository secret."
            exit 1
          fi
          mkdir -p work
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = base64.b64decode(os.environ["YOUTUBE_COOKIES_B64"], validate=True)
          if not raw or b"youtube.com" not in raw:
              raise SystemExit("The provided cookies file is empty or does not look like a YouTube cookies export.")
          path = Path("work/cookies.txt")
          path.write_bytes(raw)
          path.chmod(0o600)
          print("Private YouTube cookies prepared for yt-dlp.")
          PY

      - name: Check Python syntax
        run: python -m py_compile youtube_release_uploader/download_video.py

      - name: Download, validate and optionally publish
        run: python youtube_release_uploader/download_video.py
