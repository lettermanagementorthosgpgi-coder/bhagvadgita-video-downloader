name: BhagvadGita Video Downloader

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Download and validate only; do not touch Release assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bhagvadgita-video-downloader
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      YOUTUBE_CHANNEL_ID: UC2sBCYCH6Kb9dgqQN3vVgFw
      RELEASE_TAG: Friday
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js for PO token provider
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp and PO token plugin
        run: python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider==2.0.2

      - name: Start local YouTube PO token provider
        run: |
          docker run -d --name bgutil-provider \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:4416/ || true)
            if [ "$code" != "000" ]; then
              echo "Local PO token provider is responding."
              exit 0
            fi
            sleep 2
          done
          docker logs bgutil-provider
          echo "::error::PO token provider did not start."
          exit 1

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.get("YOUTUBE_COOKIES_B64", "").strip()
          if not encoded:
              raise SystemExit("YOUTUBE_COOKIES_B64 secret is missing or empty.")

          try:
              data = base64.b64decode(encoded, validate=True)
              content = data.decode("utf-8")
          except Exception as exc:
              raise SystemExit(f"YOUTUBE_COOKIES_B64 is not valid Base64 UTF-8: {exc}")

          lines = content.splitlines()
          if not lines or not any(line.startswith("# Netscape HTTP Cookie File") or
                                  line.startswith("# HTTP Cookie File") for line in lines[:5]):
              raise SystemExit("Cookie file is not in the expected Netscape cookies.txt format.")

          youtube_cookie_found = False
          for line in lines:
              if not line or line.startswith("#") and not line.startswith("#HttpOnly_"):
                  continue
              fields = line.split("\\t")
              if len(fields) >= 7:
                  domain = fields[0].removeprefix("#HttpOnly_").lstrip(".").lower()
                  if domain == "youtube.com" or domain.endswith(".youtube.com"):
                      youtube_cookie_found = True
                      break

          if not youtube_cookie_found:
              raise SystemExit("Cookie file contains no youtube.com cookie entries.")

          target = Path("work/youtube-cookies.txt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          target.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"YOUTUBE_COOKIES_FILE={target.resolve()}\\n")
          print("YouTube cookies decoded and validated; contents are not displayed.")
          PY

      - name: Check Python syntax
        run: python -m py_compile youtube_release_uploader/download_video.py

      - name: Download, validate and optionally publish
        run: python youtube_release_uploader/download_video.py
