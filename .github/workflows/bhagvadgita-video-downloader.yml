name: BhagvadGita Video Downloader

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Download and validate only; do not touch Release assets"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bhagvadgita-video-downloader
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      YOUTUBE_CHANNEL_ID: UC2sBCYCH6Kb9dgqQN3vVgFw
      RELEASE_TAG: Friday
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js for PO token provider
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp and PO token plugin
        run: python -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider==2.0.2

      - name: Start local YouTube PO token provider
        run: |
          docker run -d --name bgutil-provider \\
            -p 127.0.0.1:4416:4416 \\
            brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:4416/ || true)
            if [ "$code" != "000" ]; then
              echo "Local PO token provider is responding."
              exit 0
            fi
            sleep 2
          done
          docker logs bgutil-provider
          echo "::error::PO token provider did not start."
          exit 1

      - name: Check Python syntax
        run: python -m py_compile youtube_release_uploader/download_video.py

      - name: Download, validate and optionally publish
        run: python youtube_release_uploader/download_video.py
